改动概览

- 将“多边形之间互相对比”的唯一性逻辑改为“每个多边形 vs 整张图中同面积区域（联通/非联通）”的对比。
- 新增同面积区域候选生成（连通体与非联通体）与相似度计算方法，并据此重写唯一性评分。
- 保留原输出接口与可视化保存，但报告结构包含新的相似度向量信息。
新处理流程

- 检测多边形后，先对原图做二值化，得到 binary_image 。
- 对每个已检测多边形：
  - 生成同面积区域候选：
    - 联通体候选：取同图像中其他多边形，按面积容差筛选。
    - 非联通候选：在二值图上进行滑窗扫描，找出前景像素数与目标面积近似的补丁（内部多组件）。
  - 分别计算“多边形 vs 联通候选”和“多边形 vs 非联通候选”的相似度向量。
  - 计算唯一性评分：区分联通与非联通影响，权重组合得到最终分数。
- 选出唯一性评分最高的多边形，输出其边界矩形坐标与评分；保存结果图与报告。
区域候选生成策略

- 联通体候选
  - 使用同一图像中其他已检测多边形，若面积在 ±AREA_TOLERANCE_RATIO （默认 5%）范围内，则作为候选。
- 非联通候选（滑窗）
  - 在二值图上构造两种窗口尺寸：
    - polygon 的 bbox 尺寸 (w, h) 。
    - 面积近似的方形窗口 (side, side) ，其中 side ≈ sqrt(target_area) 。
  - 按 REGION_SCAN_STRIDE （默认 16 像素）在全图滑动，使用积分图 O(1) 求窗口内前景像素数。
  - 若窗口前景像素数在面积容差内，计算其内部连通组件数；组件数 > 1 作为“非联通候选”。
  - 选取与目标面积差异最小的前 REGION_MAX_CANDIDATES （默认 50）个候选以控制开销。
相似度计算逻辑

- 联通体候选（区域近似成单一轮廓）：沿用多边形相似度的加权组合
  - 形状相似度：Hausdorff 距离与 Hu 矩的平均。
  - 尺寸相似度：面积比例 min(area1, area2)/max(area1, area2) 。
  - 方向相似度：PCA 主方向差，映射到 [0,1] 。
  - 综合相似度： w_shape*shape + w_size*size + w_orient*orientation （默认权重 0.4/0.3/0.3）。
- 非联通候选（区域为掩码，可能多组件）：掩码驱动的组合
  - 掩码 Hu 相似度：把多边形与候选掩码统一到固定分辨率（500×500），计算 Hu 矩相似度。
  - 掩码方向相似度：从掩码非零点估计主方向，比对角度。
  - 尺寸相似度：同上。
  - 碎裂惩罚：组件越多，整体相似度乘以 penalty = 1/(1 + α*(num_components-1)) ，默认 FRAGMENTATION_PENALTY_ALPHA=0.5 。
  - 综合相似度：同样的三项权重乘以 penalty 。
唯一性评分（新公式）

- 对每个多边形：
  - max_connected ：与同面积联通候选的最大相似度（若无候选则为 0）。
  - avg_nonconnected ：与同面积非联通候选的平均相似度（若无候选则为 0）。
  - score = Wc*(1 - max_connected) + Wn*(1 - avg_nonconnected) ，
    - 默认 UNIQUENESS_WEIGHT_CONNECTED=0.6 ， UNIQUENESS_WEIGHT_NONCONNECTED=0.4 。
  - 直觉：如果跟其它“同面积的连通体”非常像（ max_connected 高），它就不独特；如果跟“同面积的非联通区域”整体也很像（ avg_nonconnected 高），也降低独特性。
JSON 报告变化

- uniqueness_report （主报告）新增：
  - connected_similarity_vectors : 每个多边形对应“联通候选相似度”列表。
  - nonconnected_similarity_vectors : 每个多边形对应“非联通候选相似度”列表。
  - uniqueness_scores : 新评分向量。
  - most_unique_index 、 most_unique_score 、 analysis_summary 保持。
- *_analysis.json 中仍包含：
  - image : 文件名。
  - most_unique_index 。
  - polygons : 已序列化的多边形几何/形状字段。
  - uniqueness_report : 上述新增结构整体存储。
- *_report.json （最唯一多边形的详细原始字段）保持原结构。
新增/可调参数（config.py）

- AREA_TOLERANCE_RATIO : 面积近似容差，默认 0.05 。
- REGION_SCAN_STRIDE : 非联通滑窗步长，默认 16 （调大更快、调小更精细）。
- REGION_MAX_CANDIDATES : 每个多边形的最大候选数量，默认 50 。
- FRAGMENTATION_PENALTY_ALPHA : 非联通碎裂惩罚强度，默认 0.5 。
- UNIQUENESS_WEIGHT_CONNECTED 与 UNIQUENESS_WEIGHT_NONCONNECTED ：唯一性评分权重，默认 0.6/0.4 。
- 保留 SHAPE_SIMILARITY_WEIGHT / SIZE_SIMILARITY_WEIGHT / ORIENTATION_SIMILARITY_WEIGHT 用于综合相似度。
性能与影响

- 复杂度来自滑窗：约 O(W*H/stride^2) 每个窗口尺寸；已通过步长与候选上限控制计算量。
- 适当调大 REGION_SCAN_STRIDE 或调小 REGION_MAX_CANDIDATES 能显著降耗。
- 大图或多多边形场景建议开启调试日志观察“候选数”和“相似度统计”以做参数折中。
使用与下一步

- 直接按原方式运行： python main.py image.png 或带面积过滤的命令。
- 如果你需要把 Gradio 可视化也改为显示新的“多边形-区域相似向量”，我可以同步更新 gradio_visualizer.py 的矩阵绘制逻辑，让它展示联通与非联通的两个向量列表的分布与统计。
如果你希望进一步微调“联通/非联通”的评分权重、窗口尺寸策略或碎裂惩罚公式，我可以据你的业务场景给出更针对性的组合与参数建议，并加上简单的基准测试脚本用于观察相似度分布与唯一性